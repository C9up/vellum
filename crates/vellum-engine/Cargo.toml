[package]
name = "vellum-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Low-level object-tree surgery on existing documents: merge, split, rotate,
# metadata, encryption, interactive form fields.
lopdf = "0.44"
# High-level authoring. The `pdf` feature pulls hayro-write, which is what
# lets an existing page be re-embedded as a Form XObject — the basis for
# stamping and annotating a document we did not produce.
krilla = { version = "0.8", default-features = false, features = ["pdf", "raster-images", "simple-text"] }
# Rasterising a page. Pure Rust, so the binary stays self-contained — the
# reason pdfium was not used despite being more complete.
hayro = "0.7.1"
# Reading a font a caller supplies: its character map, its glyph advances and
# the metrics a PDF font descriptor has to declare.
skrifa = "0.42"
# Cutting that font down to the glyphs actually used. Embedding a whole family
# would put megabytes into every stamped document.
subsetter = "0.2"
# JPEG encoding for page previews, and PNG decoding for stamping: a PNG has
# to become raw samples to enter a PDF, while a JPEG goes in untouched.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
