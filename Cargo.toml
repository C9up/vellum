[workspace]
resolver = "2"
members = ["crates/vellum-engine", "crates/vellum-engine-napi"]
# Upstream crates carried with a patch, not ours to format or lint.
exclude = ["vendor"]

# hayro reads every document an upload hands us, and three of its failure
# modes end the process or pin a worker rather than return an error: a stack
# overflow and an allocation failure are not panics, so no `catch_unwind`
# nets them, and an endless interpretation cannot be cancelled. Each crate
# below is the published 0.9.0 source, unchanged except where a comment
# marked `vellum:` says why:
#
# - hayro-syntax: `budget` holds per-thread limits on decoded bytes and on
#   operations; every filter charges what it decodes and stops when the
#   budget runs out, so a 1 MiB Flate stream cannot inflate to 1 GiB. It
#   also records an object skipped for nesting past 512 levels, so the
#   document is refused rather than read without it.
# - hayro-interpret: a PostScript calculator function is refused past a
#   nesting depth, and so is a chain of colour spaces or functions naming one
#   another, instead of recursing once per level; the refusal is recorded in
#   the budget, so the page is not drawn without them. Every operator and
#   glyph charges the operation budget, so a fan-out of Form XObjects cannot
#   turn a 2 KB file into hours of work.
#
# Drop a patch once upstream carries the same bound.
[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }

# Production build.
#
# The default release profile leaves `lto = false` and `codegen-units = 16`, so
# nothing inlines across crate boundaries — and in this cohort the hot loop and
# the N-API binding that calls it are always two different crates. Measured on
# atom: a scalar call through the binding went from 18.85 ms to 13.59 ms for
# 50 000 operations (-28%), and a batch from 10.93 ms to 9.08 ms (-17%). Work
# that stays inside one crate, like the bulk VM, gains a few percent.
#
# The cost is compile time — about twelve seconds instead of three on atom.
#
# No `panic = "abort"`: napi-rs catches panics and turns them into JavaScript
# exceptions, and aborting would take the host application's process down with
# a bug that was meant to surface as a caught error.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The hostile-input tests feed hayro megabytes of nesting it has to refuse;
# unoptimised, refusing them takes minutes instead of a second.
[profile.dev.package.hayro-syntax]
opt-level = 3

[profile.dev.package.hayro-interpret]
opt-level = 3
